version: 2

models:
  - name: customers_t
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: orders_t
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('customers_t')
              field: customer_id
      - name: store_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stores_t')
              field: store_id
      - name: total_amount
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: products_t
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: price
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: order_items_t
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: quantity
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: unit_price
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: line_amount
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: stores_t
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null

  - name: employees_t
    columns:
      - name: employee_id
        data_tests:
          - unique
          - not_null
      - name: store_id
        data_tests:
          - not_null
      - name: salary
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"